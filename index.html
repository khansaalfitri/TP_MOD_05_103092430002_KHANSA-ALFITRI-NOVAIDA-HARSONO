<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruang Baca - Login</title>
    <!-- Menggunakan Bootstrap 5.3.8 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success px-4">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Tentang</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Bantuan</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Login -->
    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 85vh"
    >
      <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 p-4 bg-white rounded-4">
            <div class="card-body text-center">
              <h3 class="fw-bold mb-1">Masuk ke Ruang Baca</h3>
              <p class="text-muted small mb-4">Temukan bacaan untuk hari ini</p>

              <form>
                <!-- Input Username -->
                <div class="mb-3 text-start">
                  <label for="username" class="form-label text-secondary small"
                    >Username</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Masukkan username"
                  />
                </div>

                <!-- Input Password -->
                <div class="mb-3 text-start">
                  <label for="password" class="form-label text-secondary small"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Masukkan password"
                  />
                </div>

                <!-- Checkbox Ingat Saya -->
                <div class="mb-3 text-start form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="ingatSaya"
                  />
                  <label
                    class="form-check-label text-secondary small"
                    for="ingatSaya"
                    >Ingat saya</label
                  >
                </div>

                <!-- Tombol Masuk -->
                <div class="d-grid mb-3">
                  <button type="submit" class="btn btn-success py-2">
                    Masuk
                  </button>
                </div>

                <!-- Tautan Lupa Password -->
                <div>
                  <a href="#" class="text-muted small">Lupa password?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3.8 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
